# Instructions for installing all python dependencies
# 1. Create a virtual environment: python -m venv venv
# 2. Activate the virtual environment: venv\Scripts\activate
# 3. Install `uv` globally: pip install uv
# 4. Install all dependencies: uv pip install -r pyproject.toml

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-multi-agent-graphrag-system"
version = "0.1.0"
description = "Fully offline multi-agent system with GraphRAG-style retrieval (LangGraph + NetworkX), built on Ollama — demonstrated via a CAT exam-prep assistant. Swappable to Azure OpenAI."
readme = "ReadMe.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph==1.0.1",
    "langchain==1.0.2",
    "langchain-community==0.4",
    "langchain-core==1.0.1",
    "langchain-ollama==1.0.1",
    "langchain-text-splitters==1.0.0",
    "pypdf==6.1.3",
    "streamlit==1.42.0",
    "streamlit-agraph==0.0.45",
    "networkx==3.6.1",
    "pyvis==0.3.2",
    "tenacity==9.1.4",
    "python-dotenv==1.2.2"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]
# See requirements-llamacpp.txt — llama-cpp-python needs a separate
# --extra-index-url (https://abetlen.github.io/llama-cpp-python/whl/cpu)
# that pip's dependency-list syntax can't express here.
llamacpp = [
    "llama-cpp-python"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["E402", "E701"]
